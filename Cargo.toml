[workspace]
members = [
    ".",
    "state_macros",
]

[package]
name = "agsim"
version = "2.1.1"
edition = "2024"
description = "Discrete-event simulation framework for generating realistic synthetic time-series."
license = "GPL-3.0-only"
repository = "https://github.com/jamieyoung5/agsim"
rust-version = "1.88"
keywords = ["simulation", "discrete-event", "agent-based", "synthetic-data", "time-series"]
categories = ["simulation", "science"]

[features]
# llm brings in the model-backed Mind: prompting, lenient parsing, and the two HTTP backends
# (Anthropic and any OpenAI-compatible server).
llm = ["dep:ureq", "dep:serde_json"]
# local adds the candle backend, which runs a quantized model inside the simulation process.
local = [
    "llm",
    "dep:candle-core",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
# GPU acceleration for the local backend. Without either,
# candle runs on the CPU.
cuda = ["local", "candle-core/cuda", "candle-transformers/cuda"]
metal = ["local", "candle-core/metal", "candle-transformers/metal"]

[dev-dependencies]
serde_json = "1"

[dependencies]
serde = { version = "1.0.228", features = ["derive", "rc"] }
chrono = { version = "0.4", features = ["serde"] }
state_macros = { version = "0.3.0", path = "state_macros" }
rand = "0.8.5"
rand_distr = "0.4"
ureq = { version = "2", optional = true, features = ["json"] }
serde_json = { version = "1", optional = true }
candle-core = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23", optional = true }
hf-hub = { version = "1.0", features = ["blocking", "rustls-tls"], optional = true }

[lib]
path = "src/lib.rs"

[package.metadata.docs.rs]
features = ["llm"]

[[example]]
name = "small_model"
required-features = ["llm"]

[[bench]]
name = "stress"
harness = false

[[bench]]
name = "world"
harness = false

[[bench]]
name = "alloc_profile"
harness = false

[[bench]]
name = "memory_scaling"
harness = false
